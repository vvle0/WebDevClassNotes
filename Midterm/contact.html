<!DOCTYPE html>

<html>
    <head>
        <title>Contact | Vy Le</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <a href="index.html" class="home">*</a>

            <nav>
                <ul>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main class="contact-page">
            <div class="contact">
                <h1>Contact</h1>
                <p>
                    I'd love to work with you; send me a message!
                </p>

                <form
                    class="contact-form"
                    action="https://formspree.io/f/xgaazgrw"
                    method="POST"
                >
                    <div class="field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required />
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required />
                    </div>

                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <input type="text" name="_gotcha" class="hidden-field" tabindex="-1" autocomplete="off" />

                    <button type="submit" class="contact-btn">Send</button>
                </form>
            </div>
        </main>

        <footer>
            <a href="https://www.linkedin.com/in/vvyle/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="mailto:vvyle5002@gmail.com">Email</a>
            <a href="https://www.instagram.com/v.yyle/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </footer>
    </body>
</html>
