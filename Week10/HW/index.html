<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Album</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <article class="ticket">
      <header class="poster">
        <p class="presents">Now spinning</p>
        <h1 class="billing" id="billing"></h1>
        <p class="where-when" id="where-when"></p>
      </header>

      <p class="status" id="status"></p>

      <section class="order">
        <h2>Album stats</h2>

        <p class="line" id="price-line"></p>
        <p class="line" id="fee-line"></p>
        <p class="line discount" id="discount-line"></p>

        <p class="total">
          <span>Total time</span>
          <strong id="total"></strong>
        </p>

        <p class="fine-print" id="fine-print"></p>
      </section>

      <section class="controls">
        <h2>Controls</h2>
        <button type="button" id="roll">Roll another album</button>
        <button type="button" id="less">− Track</button>
        <button type="button" id="more">+ Track</button>
        <br />
        <input type="text" id="search" placeholder="Search tracks..." />
      </section>

      <section class="lineup-wrap">
        <h2>Tracklist</h2>
        <ul class="lineup" id="lineup"></ul>
        <p class="tagline" id="tagline"></p>
      </section>
    </article>

    <script>
      const albums = ['The Most Beautiful Moment in Life Pt.1', 'The Most Beautiful Moment in Life Pt.2', 'The Most Beautiful Moment in Life: Young Forever', 'Wings', 'You Never Walk Alone', 'Love Yourself: Her', 'Love Yourself: Tear', 'Love Yourself: Answer', 'Map of the Soul: Persona', 'Map of the Soul: 7', 'BE']
      const artists = ['BTS']
      const songTitles = [
        'Intro: The Most Beautiful Moment in Life', 'Boyz with Fun', 'Converse High', 'Moving On', 'Outro: Love is Not Over', 'Run', 'Butterfly', 'Whalien 52', 'Ma City', 'Silver Spoon', 'I Need U', 'Hold Me Tight', 'Dope', 'Danger', 'Fire', 'Save Me', 'Epilogue: Young Forever', 'DNA', 'Dimple', 'Pied Piper', 'Mic Drop', 'Make It Right', 'Home', 'Black Swan', 'ON', 'We are Bulletproof: the Eternal', 'Life Goes On'
      ]
      const genres = ['K-pop', 'Pop', 'Hip-hop', 'R&B', 'Dance', 'Electronic']
      const moods = ['Chill vibes', 'Party time', 'Emotional rollercoaster', 'Feel-good tunes', 'Late-night listening', 'Upbeat and energetic', 'Melancholic melodies', 'Romantic serenade', 'Epic anthems', 'Experimental sounds']
      const accents = ['#FF5733', '#33FF57', '#3357FF', '#F1C40F', '#8E44AD', '#E74C3C', '#1ABC9C', '#2ECC71', '#3498DB']
      const MAX_TRACKS = 8

      function pickRandom(list) {
        const index = Math.floor(Math.random() * list.length)
        return list[index]
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min
      }

      let album
      let artist
      let genre
      let releaseYear
      let trackCount
      let avgSongMinutes
      let streamsMillions
      let hasExplicit
      let accent
      let mood
      let songs = [] 
      let times = [] 
      let query = '' 

      function newAlbum() {
        album = pickRandom(albums)
        artist = pickRandom(artists)
        genre = pickRandom(genres)
        releaseYear = randomBetween(2015, 2026)
        trackCount = randomBetween(1, MAX_TRACKS)
        avgSongMinutes = randomBetween(2, 5) + 0.5
        streamsMillions = randomBetween(1, 900)
        hasExplicit = randomBetween(0, 1) === 1
        accent = pickRandom(accents)
        mood = pickRandom(moods)

        songs = []
        times = []
        for (let i = 0; i < MAX_TRACKS; i++) {
          songs.push(pickRandom(songTitles))
          const minutes = randomBetween(2, 5)
          const seconds = randomBetween(10, 59)
          times.push(`${minutes}:${seconds}`)
        }

        query = ''
        document.querySelector('#search').value = ''
      }

      function render() {
        const totalMinutes = trackCount * avgSongMinutes
        const hours = Math.floor(totalMinutes / 60)
        const leftoverMinutes = Math.round(totalMinutes % 60)
        const streamsPerTrack = streamsMillions / trackCount

        const isShort = totalMinutes < 15
        const isViral = streamsMillions > 500
        const isClassic = releaseYear < 2020

        let status
        if (isViral) {
          status = `Certified hit — ${streamsMillions}M streams`
        } else if (isShort) {
          status = 'Short and sweet — an EP'
        } else {
          status = 'A solid full listen'
        }

        const trackWord = trackCount === 1 ? 'track' : 'tracks'
        const ageLine = isClassic ? 'Throwback pick' : 'Recent release'
        const explicitLine = hasExplicit ? 'Explicit lyrics' : ''

        document.querySelector('#billing').textContent = `${album.toUpperCase()} — ${artist}`
        document.querySelector('#where-when').textContent = `${genre} · ${releaseYear}`
        document.querySelector('#status').textContent = status
        document.querySelector('#price-line').textContent = `${trackCount} ${trackWord} × ${avgSongMinutes.toFixed(2)} min`
        document.querySelector('#fee-line').textContent = `${streamsMillions}M streams  —  ${streamsPerTrack.toFixed(2)}M per track`
        document.querySelector('#discount-line').textContent = explicitLine
        document.querySelector('#total').textContent = hours > 0 ? `${hours}h ${leftoverMinutes}m` : `${leftoverMinutes} min`
        document.querySelector('#fine-print').textContent = `${ageLine} · ${totalMinutes.toFixed(2)} minutes of music in total.`
        document.querySelector('#tagline').textContent = mood
        document.body.style.setProperty('--accent', accent)

        let tracklistHTML = ''
        for (let i = 0; i < trackCount; i++) {
          const song = songs[i]
          if (!song.toLowerCase().includes(query.toLowerCase())) continue

          const trackNumber = i + 1
          const stripe = i % 2 === 0 ? 'stripe' : ''
          const isLast = i === trackCount - 1
          const title = isLast ? `<span class="headline-act">${song}</span>` : song
          tracklistHTML += `<li class="${stripe}"><span class="time">${trackNumber}.</span>${title} (${times[i]})</li>`
        }
        document.querySelector('#lineup').innerHTML = tracklistHTML || '<li>No tracks match your search.</li>'

        document.querySelector('#less').disabled = trackCount <= 1
        document.querySelector('#more').disabled = trackCount >= MAX_TRACKS
      }

      document.querySelector('#roll').addEventListener('click', () => {
        newAlbum()
        render()
      })

      document.querySelector('#less').addEventListener('click', () => {
        if (trackCount > 1) trackCount--
        render()
      })

      document.querySelector('#more').addEventListener('click', () => {
        if (trackCount < MAX_TRACKS) trackCount++
        render()
      })

      document.querySelector('#search').addEventListener('input', (event) => {
        query = event.target.value
        render()
      })

      newAlbum()
      render()
    </script>
  </body>
</html>
